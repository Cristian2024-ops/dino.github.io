<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Chrome T-Rex Animado - Manzana</title>
    <style>
        body { background-color: #000; color: #0f0; font-family: monospace; display: flex; flex-direction: column; justify-content: center; align-items: center; height: 100vh; margin: 0; overflow: hidden; }
        .game-container { position: relative; width: 600px; height: 150px; border-bottom: 2px solid #0f0; overflow: hidden; background: #111; box-shadow: 0 0 15px #0f0; }
        
        /* Contenedor del dinosaurio */
        #dino-container { position: absolute; bottom: 0; left: 50px; width: 44px; height: 47px; }
        #dino-container.ducking { width: 59px; height: 30px; }
        
        /* Ocultar por defecto todos los estados del T-Rex */
        .dino-sprite { display: none; width: 100%; height: 100%; }
        
        /* Control de estados por clases de CSS animadas por JS */
        .run-1 #dino-run1, .run-2 #dino-run2, .duck-1 #dino-duck1, .duck-2 #dino-duck2, .jump #dino-stand { display: block; }
        
        .cactus { position: absolute; bottom: 0; width: 25px; height: 50px; }
        #score-board { margin-top: 15px; font-size: 1.5rem; letter-spacing: 2px; }
        #game-over { display: none; position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); font-size: 2rem; font-weight: bold; text-shadow: 0 0 10px #0f0; }
    </style>
</head>
<body>

    <div class="game-container">
        <!-- Contenedor dinámico del T-Rex -->
        <div id="dino-container" class="run-1">
            <!-- Estado: Quieto / Saltando -->
            <svg id="dino-stand" class="dino-sprite" viewBox="0 0 44 47"><path fill="#0f0" d="M22,0h12v2h2v2h2v4h-2v2h-4v2h-6v2h-2v2h-2v2h-2v-2h-2v-2h-2v-4h2v-2h2v-2h2v-2h2v-2h2v-2h2V0z M32,4h2v2h-2V4z M12,18h2v2h-2V18z M10,20h2v2h-2V20z M8,22h2v6h2v2h6v-2h2v-2h4v2h2v2h2v2h-2v2h-2v2h-4v2h-2v2h-2v-2h-2v-2h-4v2h-2v2H8v-2H6v-4H4v-2H2v-2H0v-6h2v2h2v2h2v-4h2v-2h2V20z M14,38h2v4h-2V38z M22,38h2v2h-2V38z M24,40h2v4h-2V40z M12,42h2v4h-2V42z M14,44h4v2h-4V44z M22,42h2v4h-2V42z M24,44h4v2h-4V44z"/></svg>
            <!-- Estado: Corriendo Pierna Izquierda -->
            <svg id="dino-run1" class="dino-sprite" viewBox="0 0 44 47"><path fill="#0f0" d="M22,0h12v2h2v2h2v4h-2v2h-4v2h-6v2h-2v2h-2v2h-2v-2h-2v-2h-2v-4h2v-2h2v-2h2v-2h2v-2h2v-2h2V0z M32,4h2v2h-2V4z M12,18h2v2h-2V18z M10,20h2v2h-2V20z M8,22h2v6h2v2h6v-2h2v-2h4v2h2v2h2v2h-2v2h-2v2h-4v2h-2v2h-2v-2h-2v-2h-4v2h-2v2H8v-2H6v-4H4v-2H2v-2H0v-6h2v2h2v2h2v-4h2v-2h2V20z M14,38h2v4h-2V38z M22,38h2v4h-2V38z M14,42h2v2h-2V42z M22,42h2v2h-2V42z M24,44h2v2h-2V44z"/></svg>
            <!-- Estado: Corriendo Pierna Derecha -->
            <svg id="dino-run2" class="dino-sprite" viewBox="0 0 44 47"><path fill="#0f0" d="M22,0h12v2h2v2h2v4h-2v2h-4v2h-6v2h-2v2h-2v2h-2v-2h-2v-2h-2v-4h2v-2h2v-2h2v-2h2v-2h2v-2h2V0z M32,4h2v2h-2V4z M12,18h2v2h-2V18z M10,20h2v2h-2V20z M8,22h2v6h2v2h6v-2h2v-2h4v2h2v2h2v2h-2v2h-2v2h-4v2h-2v2h-2v-2h-2v-2h-4v2h-2v2H8v-2H6v-4H4v-2H2v-2H0v-6h2v2h2v2h2v-4h2v-2h2V20z M16,38h2v4h-2V38z M24,38h2v2h-2V38z M24,40h2v2h-2V40z M14,42h2v4h-2V42z M14,44h4v2h-4V44z M22,42h2v2h-2V42z"/></svg>
            <!-- Estado: Agachado Cabeza Abajo 1 -->
            <svg id="dino-duck1" class="dino-sprite" viewBox="0 0 59 30"><path fill="#0f0" d="M2,2h4v2H2V2z M0,4h6v2H0V4z M0,6h8v2H0V6z M0,8h10v2H0V8z M0,10h14v2H0V10z M0,12h20v2H0V12z M0,14h24v2H0V14z M0,16h24v2H0V16z M0,18h26v2H0V18z M0,20h22v2H0V20z M2,22h14v2H2V22z M4,24h10v2H4V24z M4,26h2v4H4V26z M12,26h2v2h-2V26z M12,28h4v2h-4V28z M24,6h32v2H24V6z M24,8h34v2H24V8z M24,10h34v2H24V10z M24,12h34v2H24V12z M24,14h30v2H24V14z M24,16h22v2H24V16z M24,18h16v2H24V18z M46,14h2v2h-2V14z M48,12h2v2h-2V12z"/></svg>
            <!-- Estado: Agachado Cabeza Abajo 2 -->
            <svg id="dino-duck2" class="dino-sprite" viewBox="0 0 59 30"><path fill="#0f0" d="M2,2h4v2H2V2z M0,4h6v2H0V4z M0,6h8v2H0V6z M0,8h10v2H0V8z M0,10h14v2H0V10z M0,12h20v2H0V12z M0,14h24v2H0V14z M0,16h24v2H0V16z M0,18h26v2H0V18z M0,20h22v2H0V20z M2,22h14v2H2V22z M4,24h10v2H4V24z M6,26h2v4H6V26z M14,26h2v2h-2V26z M14,28h4v2h-4V28z M24,6h32v2H24V6z M24,8h34v2H24V8z M24,10h34v2H24V10z M24,12h34v2H24V12z M24,14h30v2H24V14z M24,16h22v2H24V16z M24,18h16v2H24V18z M46,14h2v2h-2V14z M48,12h2v2h-2V12z"/></svg>
        </div>
        <div id="game-over">GAME OVER</div>
    </div>
    <div id="score-board">PUNTOS: <span id="score">0</span></div>

    <script>
        const dinoBox = document.getElementById("dino-container");
        const container = document.querySelector(".game-container");
        const scoreDisplay = document.getElementById("score");
        const gameOverText = document.getElementById("game-over");

        let isJumping = false, isDucking = false, score = 0, gameActive = true;
        let obstacles = [], obstacleSpeed = 6, spawnTimer = 0, animationFrameCount = 0;

        const cactusSVG = `<svg class="cactus" viewBox="0 0 25 50" style="left:600px;"><path fill="#0f0" d="M8,0h6v50H8V0z M4,10h4v14H4V10z M2,14h2v6H2V14z M0,16h2v2H0V16z M14,14h4v18h-4V14z M18,18h2v8h-2V18z M20,20h2v4h-2V20z"/></svg>`;

        // Control de entrada del teclado
        document.addEventListener("keydown", (e) => {
            if (!gameActive && e.code === "Space") { resetGame(); return; }
            
            if ((e.code === "Space" || e.code === "ArrowUp") && !isJumping && !isDucking && gameActive) {
                jump();
            } else if (e.code === "ArrowDown" && !isJumping && gameActive) {
                duck(true);
            }
        });

        document.addEventListener("keyup", (e) => {
            if (e.code === "ArrowDown") {
                duck(false);
            }
        });

        function jump() {
            isJumping = true;
            dinoBox.className = "jump";
            let position = 0;
            let upInterval = setInterval(() => {
                if (position >= 90) {
                    clearInterval(upInterval);
                    let downInterval = setInterval(() => {
                        if (position <= 0) {
                            clearInterval(downInterval);
                            isJumping = false;
                            if (gameActive) dinoBox.className = "run-1";
                        }
                        position -= 5;
                        dinoBox.style.bottom = position + "px";
                    }, 12);
                }
                position += 7;
                dinoBox.style.bottom = position + "px";
            }, 12);
        }

        function duck(active) {
            isDucking = active;
            if (active) {
                dinoBox.classList.add("ducking");
            } else {
                dinoBox.classList.remove("ducking");
                if (!isJumping && gameActive) dinoBox.className = "run-1";
            }
        }

        function createObstacle() {
            if (!gameActive) return;
            container.insertAdjacentHTML('beforeend', cactusSVG);
            const list = container.getElementsByClassName("cactus");
            const newCactus = list[list.length - 1];
            newCactus.style.height = (Math.random() * 15 + 35) + "px";
            obstacles.push(newCactus);
        }

        function updateGame() {
            if (!gameActive) return;

            // Animación de las patas corriendo (cambia cada 8 frames)
            animationFrameCount++;
            if (!isJumping) {
                if (isDucking) {
                    dinoBox.className = (Math.floor(animationFrameCount / 8) % 2 === 0) ? "ducking duck-1" : "ducking duck-2";
                } else {
                    dinoBox.className = (Math.floor(animationFrameCount / 8) % 2 === 0) ? "run-1" : "run-2";
                }
            }

            spawnTimer++;
            if (spawnTimer > Math.random() * 40 + 70) { createObstacle(); spawnTimer = 0; }

            for (let i = obstacles.length - 1; i >= 0; i--) {
                let cactus = obstacles[i];
                let currentLeft = parseInt(cactus.style.left);

                if (currentLeft < -30) {
                    cactus.remove(); obstacles.splice(i, 1);
                    score++; scoreDisplay.innerText = score;
                    if (score % 6 === 0) obstacleSpeed += 0.6;
                } else {
                    cactus.style.left = (currentLeft - obstacleSpeed) + "px";
                }

                let dinoBottom = parseInt(dinoBox.style.bottom) || 0;
                let cactusHeight = parseInt(cactus.style.height);
                
                // Ajuste dinámico de hitbox dependiendo de si está agachado o de pie
                let dinoHitHeight = isDucking ? 25 : 42;
                if (currentLeft > 50 && currentLeft < (isDucking ? 95 : 85) && dinoBottom < (cactusHeight - 5)) {
                    if (dinoBottom + dinoHitHeight > 0) endGame();
                }
            }
            requestAnimationFrame(updateGame);
        }

        function endGame() { gameActive = false; gameOverText.style.display = "block"; dinoBox.className = "jump"; }
        function resetGame() { Array.from(container.getElementsByClassName("cactus")).forEach(c => c.remove()); obstacles = []; score = 0; obstacleSpeed = 6; scoreDisplay.innerText = score; gameOverText.style.display = "none"; gameActive = true; updateGame(); }

        updateGame();
    </script>
</body>
</html>
